name: Update earthquake catalogue and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install updater dependency
        run: python -m pip install -r requirements.txt

      - name: Run updater tests
        run: python -m unittest discover -s tests -v

      - name: Build site and update catalogue
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          touch _site/.nojekyll
          python scripts/fetch_ign_catalogue.py --output _site/data/catalogue.csv

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
